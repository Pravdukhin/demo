<style>
:root{
  --night:#081424;--night-deep:#05101d;--ink:#e8ecf1;--ink-soft:#c3ccd7;--dim:#8d9aae;--line:#22324a;
  --amber:#f2a648;--amber-glow:rgba(242,166,72,.55);--btn-fill:rgba(8,20,36,.35);
  --font:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad-l:max(20px,env(safe-area-inset-left,0px));--pad-r:max(20px,env(safe-area-inset-right,0px));
  --top:56px;--colw:min(460px,36vw);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
body{margin:0;font-size:15px;line-height:1.5;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.stage{position:fixed;inset:0;background:var(--night-deep);overflow:hidden}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}
.layer.on{opacity:1;visibility:visible;transition:opacity .5s ease}
.L-film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--night-deep);opacity:0}
.L-film video.on{opacity:1}
.L-view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,20,36,.94) 0,rgba(8,20,36,.82) calc(var(--colw) * .72),rgba(8,20,36,0) calc(var(--colw) + 160px)),linear-gradient(180deg,rgba(8,20,36,.55) 0,rgba(8,20,36,0) 130px)}

.panel{position:fixed;z-index:5;left:var(--pad-l);top:calc(var(--top) + 24px);bottom:70px;width:calc(var(--colw) - 20px);display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.pin{pointer-events:auto;max-height:100%;overflow-y:auto;scrollbar-width:thin;padding-right:6px;transition:opacity .3s ease}
.pin.sw{opacity:0}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
.pin h2{font-weight:300;font-size:clamp(28px,3.2vw,44px);letter-spacing:-.02em;line-height:1.08;margin:0 0 16px;text-wrap:balance}
.pin p{margin:0 0 12px;color:var(--ink-soft);font-size:16px;line-height:1.55;max-width:42ch}
.btn{display:inline-block;margin-top:8px;padding:11px 18px;border:1px solid var(--amber);color:var(--ink);text-decoration:none;font-size:15px;font-weight:400;border-radius:999px;background:var(--btn-fill);cursor:pointer}
.btn:hover{background:rgba(8,20,36,.65)}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li button{appearance:none;background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;padding:10px 0;cursor:pointer;color:var(--ink-soft);display:flex;gap:12px;align-items:baseline;font-size:15px}
.tl li button:hover{color:var(--ink)}
.tl b{font-weight:400;color:var(--amber);min-width:1.4em}

/* шкала фильма */
.bar{position:fixed;z-index:6;left:calc(var(--colw) + 70px);right:calc(var(--pad-r) + 16px);bottom:26px;display:flex;align-items:center;gap:16px}
.pp{appearance:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--amber);background:var(--btn-fill);cursor:pointer;flex:none;display:grid;place-items:center}
.pp svg{width:14px;height:14px;fill:var(--ink)}
.rail{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none}
.rail::before{content:"";position:absolute;left:0;right:0;top:14px;height:2px;background:rgba(232,236,241,.14)}
.rail u{position:absolute;left:0;right:0;top:14px;height:2px;text-decoration:none;pointer-events:none}
.rail i{position:absolute;left:0;top:14px;height:2px;background:rgba(232,236,241,.6);width:0}
.rail b{position:absolute;top:9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber-glow);left:0;pointer-events:none}
.rail s{position:absolute;top:11px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--night);border:1.5px solid var(--ink-soft)}
.rail s.done{background:var(--ink-soft)}
.tm{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:74px;text-align:right;text-shadow:0 1px 10px rgba(8,20,36,.9)}

/* главы справа */
.ticks{position:fixed;z-index:6;right:var(--pad-r);top:50%;transform:translateY(-50%);list-style:none;margin:0;padding:0}
.ticks::before{content:"";position:absolute;right:4px;top:10px;bottom:10px;width:1px;background:rgba(232,236,241,.42)}
.ticks li button{appearance:none;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:7px 0;color:var(--ink-soft);font-size:13px;width:100%;text-shadow:0 1px 10px rgba(8,20,36,.95);opacity:.75}
.ticks li button::after{content:"";width:9px;height:1px;background:rgba(232,236,241,.6)}
.ticks li.on button{color:var(--ink);opacity:1}
.ticks li.on button::after{width:18px;background:var(--amber);height:2px}
.ticks li button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .25s}
.ticks:hover li button span,.ticks li.on button span{max-width:260px}

/* схема */
.L-plan{background:var(--night-deep);display:flex;align-items:center;justify-content:flex-end}
.planwrap{position:absolute;left:calc(var(--colw) + 40px);right:var(--pad-r);top:calc(var(--top) + 30px);bottom:40px;display:flex;align-items:center;overflow:auto}
.planbox{position:relative;width:100%;flex:none}
.planbox img{display:block;width:100%;height:auto;filter:brightness(1.35)}
.planbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mk{cursor:pointer}
.mk circle.r{fill:rgba(8,20,36,.82);stroke:var(--amber);stroke-width:4}
.mk circle.h{fill:none;stroke:var(--amber);stroke-width:3;opacity:.45}
.mk:hover circle.r,.mk.on circle.r{fill:var(--amber)}
.mk text{fill:var(--ink);font-family:var(--font);font-weight:400;font-size:40px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk:hover text,.mk.on text{fill:var(--night)}
.note{font-size:12px;color:var(--dim);margin-top:14px}

.big{position:fixed;z-index:8;left:calc(50% + var(--colw) / 2);top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;border:1px solid var(--amber);background:rgba(8,20,36,.6);cursor:pointer;display:grid;place-items:center}
.big svg{width:28px;height:28px;fill:var(--ink);margin-left:5px}

.lng{position:fixed;z-index:46;top:calc(12px + env(safe-area-inset-top,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 54px);height:46px;display:flex;align-items:center;gap:8px}
.home{height:36px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--amber);border-radius:999px;background:var(--btn-fill);color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.02em;white-space:nowrap;transition:background .2s;-webkit-tap-highlight-color:transparent}
.home:hover{background:rgba(8,20,36,.65)}
.lsw{appearance:none;height:46px;min-width:46px;border:0;border-radius:23px;background:rgba(8,20,36,.35);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 13px 0 15px;font:inherit;font-size:14px;letter-spacing:.05em;-webkit-tap-highlight-color:transparent;transition:background .2s}
.lsw:hover,.lsw[aria-expanded="true"]{background:rgba(8,20,36,.65)}
.lsw .cv{width:7px;height:7px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:translateY(-2px) rotate(45deg)}
.lsd{position:absolute;top:54px;right:0;min-width:190px;background:rgba(10,24,42,.97);border:1px solid var(--line);border-radius:14px;padding:6px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.lsd.open{opacity:1;transform:none;pointer-events:auto}
.lsd button{appearance:none;display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;color:var(--ink);font:inherit;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:15px}
.lsd button:hover{background:rgba(255,255,255,.05)}
.lsd .k{width:22px;color:var(--dim);font-size:12px;letter-spacing:.05em}
.lsd button[aria-pressed="true"],.lsd button[aria-pressed="true"] .k{color:var(--amber)}
.lsd .ok{margin-left:auto;color:var(--amber);visibility:hidden}
.lsd button[aria-pressed="true"] .ok{visibility:visible}

.swh{display:none}
@keyframes sw{0%{transform:translateY(0);opacity:0}25%{opacity:1}80%{transform:translateY(-9px);opacity:0}100%{opacity:0}}
@keyframes swd{0%{transform:translateY(0);opacity:0}25%{opacity:1}80%{transform:translateY(9px);opacity:0}100%{opacity:0}}
@media (max-width:760px){
  :root{--colw:100vw;--vh:56.25vw;--vt:calc(var(--top) + env(safe-area-inset-top,0px))}
  .shade{background:linear-gradient(180deg,rgba(8,20,36,.55) 0,rgba(8,20,36,0) 110px)}
  .stage{touch-action:none}
  .L-film video,.L-view img{inset:auto;left:0;right:0;top:var(--vt);height:var(--vh);object-fit:cover}
  .panel{left:0;right:0;width:auto;top:calc(var(--vt) + var(--vh));bottom:calc(64px + env(safe-area-inset-bottom,0px));display:block}
  .pin{height:100%;padding:52px var(--pad-r) 8px var(--pad-l)}
  body:not(.plan):not(.view) .pin{overflow:hidden;touch-action:none}
  body:not(.plan):not(.view) .pin .btn{display:none}
  .pin h2{font-size:25px;margin-bottom:10px}
  .pin p{font-size:14.5px;line-height:1.5;max-width:none;margin-bottom:9px}
  .lbl{margin-bottom:10px}
  .ticks{display:none}
  .bar{left:22px;right:22px;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));gap:12px}
  .pp{width:38px;height:38px}
  .tm{display:none}
  .swh{appearance:none;font-family:inherit;cursor:pointer;display:flex;position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(var(--vt) + var(--vh) + 10px);align-items:center;gap:9px;padding:5px 14px 5px 9px;border-radius:999px;background:none;border:1px solid transparent;color:var(--dim);font-size:12px;letter-spacing:.04em;white-space:nowrap}
  .swh.pl{background:rgba(8,20,36,.78);border-color:var(--line);color:var(--ink-soft)}
  .swh i{position:relative;width:14px;height:22px;border:1.5px solid var(--ink-soft);border-radius:9px;flex:none}
  .swh i::after{content:"";position:absolute;left:50%;bottom:4px;width:3px;height:6px;margin-left:-1.5px;border-radius:2px;background:var(--amber);animation:sw 1.6s ease-in-out infinite}
  .swh.dn i::after{bottom:auto;top:4px;animation-name:swd}
  .planwrap{left:0;right:0;top:var(--vt);bottom:auto;height:var(--vh);align-items:center}
  .planbox{width:auto;height:100%}
  .planbox img{height:100%;width:auto;max-width:none}
  .big{left:50%;top:calc(var(--vt) + 28vw);width:64px;height:64px}
  body.plan .bar,body.view .bar{visibility:hidden}
  body.plan .panel,body.view .panel{bottom:0}
  .lng{gap:5px}
  .home{height:32px;padding:0 10px;font-size:12px}
}
</style>
</head>

/* главы фильма: время начала, подпись на шкале, текст */
var CH=[
 {t:0,ru:{k:'Задача',l:'Конференция · 1100 гостей',h:'Зал 150 на 29 метров',p:['Задача: комфортно разместить 1100 гостей за банкетными столами в очень вытянутом зале. Он состоит из двух, его длина около 150 метров, а ширина около 29.','Сцена в торце не подходит: дальние столы окажутся в 100 метрах от неё. Сцена по длинной стороне тоже: по краям появятся огромные мёртвые зоны.','Поэтому сцена стоит в центре, а в начале вечера зал разделён пополам двумя проекционными экранами. Гости заходят с двух сторон и видят только свою половину.']},
       en:{k:'The task',l:'Conference · 1100 guests',h:'A hall of 150 by 29 metres',p:['The task: seat 1100 guests comfortably at banquet tables in a very long hall. It is made of two rooms, about 150 metres long and about 29 metres wide.','A stage at the end does not work: the far tables end up 100 metres away. A stage along the long wall does not work either: it leaves huge dead zones on both sides.','So the stage stands in the centre, and at the start of the evening the hall is split in half by two projection screens. Guests enter from two sides and see only their own half.']}},
 {t:4.67,ru:{k:'Кабуки',l:'Система сброса кабуки',h:'Экраны падают, и зал становится единым',p:['Экраны висят на кабуки: системе, которая сбрасывает полотно по команде с пульта.','В нужный момент экраны падают, и две половины оказываются одним пространством. Гости впервые видят друг друга и сцену в центре.']},
       en:{k:'Kabuki',l:'Kabuki drop system',h:'The screens drop and the hall becomes one space',p:['The screens hang on a kabuki: a system that releases the fabric on a cue from the control desk.','At the right moment the screens drop and the two halves turn into one space. The guests see each other, and the stage in the centre, for the first time.']}},
 {t:9.3,ru:{k:'Сцены',l:'Решение',h:'Две сцены в центре зала',p:['Две относительно небольшие сцены стоят друг напротив друга в центре зала, а подиум-трансформер соединяет их в одну.','Спикеры и артисты работают из центра на две стороны, и дальние ряды находятся не более чем в 50 метрах.']},
       en:{k:'Stages',l:'The solution',h:'Two stages in the centre of the hall',p:['Two fairly small stages face each other in the centre of the hall, and a transforming catwalk joins them into one.','Speakers and artists work from the centre to both sides, and the far rows are no more than 50 metres away.']}},
 {t:18.9,ru:{k:'Подиум',l:'Подиум-трансформер',h:'Подиум раздвигается и уходит в сцены',p:['Во второй части мероприятия подиум оперативно раздвигается и становится частью сцен.','Одна сцена остаётся спикерам, вторая артистам.']},
       en:{k:'Catwalk',l:'Transforming catwalk',h:'The catwalk splits and slides into the stages',p:['In the second part of the event the catwalk quickly splits and becomes part of the stages.','One stage stays with the speakers, the other goes to the artists.']}},
 {t:35.6,ru:{k:'Смена',l:'По ходу вечера',h:'Зал меняется вместе с программой',p:['Вместе с подиумом меняются контент на экранах и свет. Когда нужно, подиум собирается обратно.','Одна и та же площадка за вечер проходит несколько состояний, и каждое из них видно заранее, ещё до монтажа.']},
       en:{k:'Change',l:'During the evening',h:'The hall changes with the programme',p:['The screen content and the lighting change together with the catwalk. When needed, the catwalk comes back together.','The same venue goes through several states in one evening, and each of them can be seen in advance, before load-in.']}},
 {t:53.5,ru:{k:'Гости',l:'Обзор',h:'Сцену видно с любого стола',p:['LED-полотна экранов идут по всему залу. Все участники хорошо видят то, что происходит на сценах, где бы ни стоял их стол.']},
       en:{k:'Guests',l:'Sightlines',h:'The stage is visible from every table',p:['LED screens run along the whole hall. Every guest can clearly see what is happening on the stages, wherever their table is.']}},
 {t:69.5,ru:{k:'Техника',l:'Технические зоны',h:'Пультовая не занимает места гостей',p:['Пультовая и другие технические зоны встроены в один из торцов зала. Они не стоят среди гостей, а пультовая при этом находится на комфортном расстоянии от сцены, в районе 50 метров.']},
       en:{k:'Tech',l:'Technical areas',h:'The control desk takes no guest space',p:['The control desk and the other technical areas are built into one end of the hall. They do not sit among the guests, while the desk stays at a comfortable distance from the stage, around 50 metres.']}},
 {t:77.4,ru:{k:'Схема',l:'Схема зала',h:'От сцены к схеме',p:['Камера поднимается над залом, и он превращается в схему рассадки. На ней отмечены столы: с каждого можно посмотреть, как видно сцену.']},
       en:{k:'Plan',l:'Hall plan',h:'From the stage to the plan',p:['The camera rises above the hall and it turns into the seating plan. Tables are marked on it: from each one you can check the view of the stage.']}}
];
var T={ru:{planL:'Схема зала',planH:'Выберите стол',planP:'Нажмите на отметку на схеме или на строку в списке: откроется вид на сцену с этого стола.',again:'Смотреть 3D сначала',toPlan:'К схеме зала',back:'← К схеме',viewL:'Вид с места',note:'Рабочая демонстрация. Материалы проекта не для публикации.',tbl:'Стол',sw:'Листайте вверх',swPlan:'Назад в 3D',swView:'Назад к схеме'},
       en:{planL:'Hall plan',planH:'Pick a table',planP:'Tap a mark on the plan or a line in the list: the view of the stage from that table will open.',again:'Watch the 3D again',toPlan:'To the hall plan',back:'← Back to the plan',viewL:'View from the seat',note:'Working demo. Project materials are not for publication.',tbl:'Table',sw:'Swipe up',swPlan:'Back to 3D',swView:'Back to the plan'}};
/* столы с видами: координаты на плане 2800x632 поставлены по догадке, сверить с Юрием */
var TB=[
 {n:1,x:2002,y:319,img:'media/tv1.jpg',ru:'В центре зала',en:'Centre of the hall'},
 {n:2,x:2054,y:445,img:'media/tv2.jpg',ru:'Сбоку',en:'At the side'},
 {n:3,x:2251,y:445,img:'media/tv3.jpg',ru:'В углу зала',en:'Corner of the hall'},
 {n:4,x:1956,y:129,img:'media/tv4.jpg',ru:'У стены',en:'By the wall'},
 {n:5,x:1698,y:507,img:'media/tv5.jpg',ru:'У центральной сцены',en:'By the centre stage'},
 {n:6,x:1579,y:381,img:'media/tv6.jpg',ru:'У подиума',en:'By the catwalk'}
];

function lang(){return (document.documentElement.lang||'ru').slice(0,2)==='en'?'en':'ru'}
function tt(k){return T[lang()][k]}

/* ---------- плеер из отрезков ---------- */
var V=[$('v0'),$('v1')],act=0,seg=-1,mode='film',ch=-1,cur=null,ended=false,drag=false,pos=null,wantSeg=-1;
function A(){return V[act]}function B(){return V[1-act]}
function gt(){if(pos!=null)return pos;return seg<0?0:Math.min(TOTAL,seg*SEG+(A().currentTime||0))}
function setCT(v,o){v._t=o;if(v.readyState<1||v.seeking){v._w=o;return}v._w=null;try{v.currentTime=o}catch(e){}}
function loadAt(v,i,o,cb){v._cb=cb||null;v._keep=false;if(v.getAttribute('data-i')!==String(i)){v.setAttribute('data-i',i);v._w=o;v._t=o;v.src=src(i);v.load()}else{setCT(v,o);if(v.readyState>=2)prime(v)}}
function prep(v,i){v._cb=null;v._w=null;v._t=0;v._keep=false;if(i>=N||i<0)return;if(v.getAttribute('data-i')!==String(i)){v.setAttribute('data-i',i);v.src=src(i);v.load()}}
/* на iPhone кадр ни разу не игравшего видео не рисуется: коротко запускаем и сразу ставим на паузу */
function prime(v){var id=v.getAttribute('data-i');if(v._pr===id||!v.paused||v._keep)return;if(v!==A()&&!A().paused)return;v._pr=id;var p=v.play();
  if(p&&p.then)p.then(function(){if(v._keep)return;v.pause();if(v._t!=null){try{v.currentTime=v._t}catch(e){}}}).catch(function(){v._pr=null})}
V.forEach(function(v){
  v.addEventListener('loadeddata',function(){prime(v)});
  function flush(){if(v._w!=null&&v.readyState>=1&&!v.seeking){var w=v._w;v._w=null;try{v.currentTime=w}catch(e){}return true}return false}
  v.addEventListener('loadedmetadata',flush);
  v.addEventListener('seeked',function(){if(flush())return;if(v._cb){var c=v._cb;v._cb=null;c()}});
});
/* перейти ко времени t. Внутри текущего отрезка просто перемотка; в другой отрезок грузим в скрытый тег и меняем местами, когда кадр готов */
function seek(t,play){
  t=Math.max(0,Math.min(TOTAL-0.05,t));ended=false;pos=t;playWant=false;
  var i=Math.min(N-1,Math.floor(t/SEG)),o=Math.max(i===0?0.1:0.01,t-i*SEG),a=A(),b=B();wantSeg=i;
  if(seg===i&&a.getAttribute('data-i')===String(i)){b._cb=null;setCT(a,o);if(play)start();else prep(b,(o<SEG/2&&i>0)?i-1:i+1);return}
  if(seg<0){seg=i;a.setAttribute('data-i',i);a._w=o;a._t=o;a.src=src(i);a.load();prep(b,i+1);if(play)start();return}
  loadAt(b,i,o,function(){if(wantSeg!==i)return;b.classList.add('on');a.classList.remove('on');a.pause();act=1-act;seg=i;prep(a,i+1);if(play||playWant){playWant=false;start()}else icon()});
}
var playWant=false;
function start(){ended=false;if(B()._cb&&wantSeg!==seg){playWant=true;return}var a=A();function go(){pos=null;a._keep=true;var p=a.play();if(p&&p.catch)p.catch(function(){if(mode==='film')$('big').hidden=false})}
  if(a._w!=null||a.seeking){a._cb=go}else go()}
function next(){
  if(seg+1>=N){ended=true;toPlan();return}
  var a=A(),b=B();seg++;act=1-act;wantSeg=seg;b._keep=true;a._keep=false;
  try{b.currentTime=0}catch(e){}
  var done=false;function sw(){if(done)return;done=true;b.removeEventListener('timeupdate',tu);if(A()!==b)return;b.classList.add('on');a.classList.remove('on');a.pause();if(!a._cb)prep(a,seg+1)}
  function tu(){if(b.currentTime>0.02)sw()}
  b.addEventListener('timeupdate',tu);if(b.requestVideoFrameCallback)b.requestVideoFrameCallback(function(){sw()});setTimeout(sw,700);
  var p=b.play();if(p&&p.catch)p.catch(function(){});
}
V.forEach(function(v){v.addEventListener('ended',function(){if(v===A())next()});v.addEventListener('playing',function(){$('big').hidden=true;icon();if(v===A())setTimeout(prefetch,800)});v.addEventListener('pause',icon)});
function playing(){return !A().paused&&!ended}
function stop(){if(pos==null)pos=gt();A()._keep=false;A().pause();icon()}
function icon(){$('pp').innerHTML=playing()?'<svg viewBox="0 0 24 24"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>'}
$('pp').addEventListener('click',function(){if(mode!=='film'){toFilm(0,true);return}if(ended){seek(0,true);return}if(playing())stop();else start()});
$('big').addEventListener('click',function(){$('big').hidden=true;start()});
$('swh').addEventListener('click',function(){if(mode==='view')toPlan();else if(mode==='plan')toFilm(TOTAL-0.4,false);else if(playing())stop();else start()});
function swh(){var h=$('swh');h.className='swh '+(mode==='film'?'up':'pl dn');h.querySelector('span').textContent=tt(mode==='view'?'swView':mode==='plan'?'swPlan':'sw')}
$('Lfilm').addEventListener('click',function(){if(playing())stop();else start()});

/* ---------- прокрутка: колесо и палец двигают фильм вручную ---------- */
function scrub(d){var t=gt()+d;if(t>=TOTAL-0.06&&d>0){toPlan();return}seek(t,false)}
var wAcc=0,wT=0,pAcc=0,pT=0;
window.addEventListener('wheel',function(e){
  if(e.target.closest&&e.target.closest('#lng'))return;
  var pin=e.target.closest&&e.target.closest('#pin');
  var dy=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?400:1),now=Date.now();
  if(mode==='view')return;
  if(mode==='plan'){if(pin&&pin.scrollHeight>pin.clientHeight+4)return;e.preventDefault();if(now-pT>500)pAcc=0;pT=now;if(dy<0){pAcc-=dy;if(pAcc>150){pAcc=0;toFilm(TOTAL-0.4,false)}}return}
  e.preventDefault();
  if(playing()){if(now-wT>450)wAcc=0;wT=now;wAcc+=Math.abs(dy);if(wAcc<50)return;wAcc=0;stop();return}
  scrub(dy*0.012);
},{passive:false});
var ts=null;
document.addEventListener('touchstart',function(e){ts=null;var t=e.target;if(!t.closest||e.touches.length!==1||mode!=='film')return;if(t.closest('#rail,#lng,#pp,#swh,#big,a,nav,header,[class*=pvn]'))return;
  ts={y:e.touches[0].clientY,x:e.touches[0].clientX,acc:0,dir:0}},{passive:true});
document.addEventListener('touchmove',function(e){if(!ts)return;var c=e.touches[0],d=ts.y-c.clientY,dx=c.clientX-ts.x;
  if(!ts.dir){if(Math.abs(d)<6&&Math.abs(dx)<6)return;ts.dir=Math.abs(d)>=Math.abs(dx)?1:2}
  if(ts.dir!==1)return;e.preventDefault();ts.y=c.clientY;
  if(playing()){ts.acc+=Math.abs(d);if(ts.acc<28)return;stop()}
  scrub(d*0.045)},{passive:false});
document.addEventListener('touchend',function(){ts=null});

/* ---------- шкала ---------- */
function buildRail(){var r=$('rail');r.querySelectorAll('s').forEach(function(e){e.remove()});CH.forEach(function(c,i){var s=document.createElement('s');s.style.left=(c.t/TOTAL*100)+'%';s.title=c[lang()].k;r.appendChild(s)})}
function fmt(t){t=Math.floor(t);return Math.floor(t/60)+':'+(t%60<10?'0':'')+(t%60)}
function railT(e){var b=$('rail').getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*TOTAL}
var wasPlay=true;$('rail').addEventListener('pointerdown',function(e){drag=true;$('rail').setPointerCapture(e.pointerId);if(mode!=='film'){wasPlay=true;toFilm(railT(e),false)}else{wasPlay=playing();stop();seek(railT(e),false)}});
$('rail').addEventListener('pointermove',function(e){if(drag)seek(railT(e),false)});
$('rail').addEventListener('pointerup',function(){if(drag){drag=false;if(wasPlay)start()}});
function tick(){
  var t=mode==='film'?gt():TOTAL,p=t/TOTAL*100;
  $('fill').style.width=p+'%';$('knob').style.left=p+'%';$('tm').textContent=fmt(t)+' / '+fmt(TOTAL);
  var ss=$('rail').querySelectorAll('s');for(var i=0;i<ss.length;i++)ss[i].classList.toggle('done',CH[i].t<=t);
  if(mode==='film'){var k=0;for(var j=0;j<CH.length;j++)if(t>=CH[j].t)k=j;if(k!==ch){ch=k;panel()}}
  requestAnimationFrame(tick);
}

/* ---------- панель текста ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function html(){
  var L=lang();
  if(mode==='film'){var c=CH[ch<0?0:ch][L];return '<p class="lbl">'+esc(c.l)+'</p><h2>'+esc(c.h)+'</h2>'+c.p.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'<button class="btn" data-a="plan">'+tt('toPlan')+' ↓</button>'}
  if(mode==='view'&&cur){return '<p class="lbl">'+tt('viewL')+'</p><h2>'+tt('tbl')+' '+cur.n+'</h2><p>'+esc(cur[L])+'</p><button class="btn" data-a="plan">'+tt('back')+'</button>'}
  return '<p class="lbl">'+tt('planL')+'</p><h2>'+tt('planH')+'</h2><p>'+tt('planP')+'</p><ul class="tl">'+TB.map(function(b){return '<li><button data-t="'+b.n+'"><b>'+b.n+'</b>'+esc(b[L])+'</button></li>'}).join('')+'</ul><button class="btn" data-a="film">'+tt('again')+'</button><p class="note">'+tt('note')+'</p>';
}
var swT=0;
function panel(now){var p=$('pin');clearTimeout(swT);if(now){p.innerHTML=html();p.classList.remove('sw');ticks();return}p.classList.add('sw');swT=setTimeout(function(){p.innerHTML=html();p.scrollTop=0;p.classList.remove('sw')},300);ticks()}
$('pin').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.a==='plan')toPlan();else if(b.dataset.a==='film')toFilm(0,true);else if(b.dataset.t)openView(+b.dataset.t)});

function ticks(){var L=lang(),o=$('ticks');o.innerHTML=CH.map(function(c,i){return '<li class="'+(mode==='film'&&i===ch?'on':'')+'"><button data-c="'+i+'"><span>'+esc(c[L].k)+'</span></button></li>'}).join('')+'<li class="'+(mode!=='film'?'on':'')+'"><button data-c="plan"><span>'+tt('planH')+'</span></button></li>'}
$('ticks').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.c==='plan')toPlan();else toFilm(CH[+b.dataset.c].t+0.05,true)});

/* ---------- режимы ---------- */
function show(id){['Lfilm','Lplan','Lview'].forEach(function(x){$(x).classList.toggle('on',x===id)});document.body.className=mode;swh()}
function toFilm(t,play){mode='film';ch=-1;show('Lfilm');seek(t||0,play!==false);icon()}
function toPlan(){A().pause();$('big').hidden=true;pos=null;mode='plan';cur=null;show('Lplan');marks();panel();icon();if(small){var w=$('planwrap');requestAnimationFrame(function(){w.scrollLeft=w.scrollWidth*0.55})}}
function openView(n){cur=TB.filter(function(b){return b.n===n})[0];if(!cur)return;mode='view';$('vImg').src=cur.img;show('Lview');panel()}
function marks(){$('svg').innerHTML=TB.map(function(b){return '<g class="mk'+(cur&&cur.n===b.n?' on':'')+'" data-t="'+b.n+'"><circle class="h" cx="'+b.x+'" cy="'+b.y+'" r="46"/><circle class="r" cx="'+b.x+'" cy="'+b.y+'" r="32"/><text x="'+b.x+'" y="'+(b.y+2)+'">'+b.n+'</text></g>'}).join('')}
$('svg').addEventListener('click',function(e){var g=e.target.closest('.mk');if(g)openView(+g.dataset.t)});
$('Lview').addEventListener('click',function(){toPlan()});
$('vImg').addEventListener('error',function(){if(mode==='view')toPlan()});
document.addEventListener('keydown',function(e){if(e.key===' '&&mode==='film'){e.preventDefault();if(playing())stop();else start()}if((e.key==='ArrowRight'||e.key==='ArrowDown')&&mode==='film'){var pl=playing();seek(gt()+5,pl)}if((e.key==='ArrowLeft'||e.key==='ArrowUp')&&mode==='film'){var pl2=playing();seek(gt()-5,pl2)}if(e.key==='Escape'&&mode==='view')toPlan()});

/* ---------- язык и запуск ---------- */
function applyLang(){document.title=lang()==='ru'?'Конференция на 1100 гостей: интерактивная презентация':'Conference, 1100 guests: interactive presentation';$('lsd').querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===lang()?'true':'false')});$('lsc').textContent=lang().toUpperCase();$('home').href='https://pravdukhin.com/?lang='+lang()+'#interactive';buildRail();panel(true);swh()}
(function(){var q=null;try{q=new URLSearchParams(location.search).get('lang')}catch(e){}
  if(q!=='ru'&&q!=='en'){try{q=localStorage.getItem('lang')}catch(e){}}
  if(q!=='ru'&&q!=='en')q=/^ru\b/i.test(navigator.language||'')?'ru':'en';
  document.documentElement.lang=q})();
function lsOpen(o){$('lsd').classList.toggle('open',o);$('lsw').setAttribute('aria-expanded',o?'true':'false')}
$('lng').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='lsw'){lsOpen(!$('lsd').classList.contains('open'));return}if(b.dataset.l){document.documentElement.lang=b.dataset.l;try{document.dispatchEvent(new CustomEvent('sitelang',{bubbles:true,detail:{lang:b.dataset.l}}))}catch(x){}try{localStorage.setItem('lang',b.dataset.l)}catch(x){}lsOpen(false)}});
document.addEventListener('pointerdown',function(e){if(!e.target.closest||!e.target.closest('#lng'))lsOpen(false)});
new MutationObserver(applyLang).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
ch=0;applyLang();icon();
if(location.hash==='#plan'){seek(TOTAL-0.4,false);toPlan()}else seek(0,true);
requestAnimationFrame(tick);
})();
</script>
